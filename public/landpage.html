<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RT-VLibras - Solução de acessibilidade com tradução em tempo real" />
  <title>RT-VLibras - Tradução em Tempo Real</title>
  <link rel="icon" href="https://www.ifmg.edu.br/conselheirolafaiete/noticias/anexos-noticias/libras-768x767.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #3498db;
      --primary-dark: #2980b9;
      --bg: #f0f4f8;
      --text: #2c3e50;
      --muted: #7f8c8d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6ecf1 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 3rem 2rem;
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    .logo {
      max-width: 120px;
      margin: 0 auto 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 2rem;
      border-radius: 10px;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s ease;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      max-width: 300px;
      margin: 0 auto;
    }

    .btn i {
      font-size: 2.5rem;
      margin-bottom: 0.7rem;
    }

    .btn span {
      font-size: 0.9rem;
      font-weight: normal;
      margin-top: 0.3rem;
    }

    .btn:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 1.6rem;
      }
      
      .container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://www.ifmg.edu.br/conselheirolafaiete/noticias/anexos-noticias/libras-768x767.png" alt="Logo VLibras" class="logo" />

    <h1>RT-VLibras</h1>
    <p class="subtitle">Solução de acessibilidade com tradução de áudio para Libras em tempo real</p>

    <a href="/app" class="btn">
      <i class="fas fa-sign-in-alt"></i>
      Acessar Tradutor
      <span>Versão única para todos os dispositivos</span>
    </a>

    <div class="footer">
      <p>&copy; 2025 RT-VLibras. Todos os direitos reservados.</p>
    </div>
  </div>
</body>
</html>
