<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Solução de acessibilidade com VLibras para transmissão de áudio">
  <title>MQF - Transmissão de Áudio</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="./img/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon/favicon-16x16.png">
  <link rel="manifest" href="./img/favicon/site.webmanifest">
  <link rel="icon" type="image/x-icon" href="./img/favicon/favicon.ico">
  <link rel="shortcut icon" href="./img/favicon/favicon.ico">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./css/VLibras.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div vw class="enabled">
    <div vw-access-button class="permanently-hidden"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <header class="header">
    <div class="controls">
      <button id="startBtn" class="btn btn-primary">
        <i class="fas fa-play"></i>
        Conectar
      </button>
      <button id="stopBtn" class="btn btn-danger" disabled>
        <i class="fas fa-stop"></i>
        Desconectar
      </button>
    </div>
    
    <div id="status" class="status disconnected">
      <i class="fas fa-circle"></i>
      Status: Desconectado
    </div>
  </header>

  <div class="back-link-container">
    <a href="/" class="back-link">
      <i class="fas fa-arrow-left"></i>
      Voltar
    </a>
  </div>
  <div vw class="enabled">
    <div vw-access-button class="permanently-hidden"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="./js/script-vlibras.js"></script>
  <script type="module" src="./js/vlibras-loader.js"></script>
  <script src="./js/audio_ws.js"></script>
  <script>
    // Espera o VLibras carregar
    const waitForVLibras = setInterval(() => {
      if (window.plugin?.player) {
        clearInterval(waitForVLibras);
        console.log("[VLibras] Player carregado, enviando frase inicial");

        // Inicializa a fila, se ainda não estiver inicializada
        if (typeof window.initVLibrasQueue === "function") {
          window.initVLibrasQueue((onGlossEnd) => {
            // callback quando uma frase terminar
            console.log("[VLibras] Gloss terminou");
          });
        }

        // Envia a frase de boas-vindas
        if (typeof window.addNewPhrase === "function") {
          window.addNewPhrase("Bem-vindo");
        }
      }
    }, 300);
    const waitForButton = setInterval(() => {
      const btn = document.querySelector('path[d="M10.4 15.8H12.1V14.1H10.4V15.8ZM10.4 19.2H17.2V17.5H10.4V19.2ZM18.9 19.2H20.6V17.5H18.9V19.2ZM13.8 15.8H20.6V14.1H13.8V15.8ZM8.7 22.6C8.2325 22.6 7.83243 22.4337 7.4998 22.1011C7.1666 21.7679 7 21.3675 7 20.9V10.7C7 10.2325 7.1666 9.83243 7.4998 9.4998C7.83243 9.1666 8.2325 9 8.7 9H22.3C22.7675 9 23.1679 9.1666 23.5011 9.4998C23.8337 9.83243 24 10.2325 24 10.7V20.9C24 21.3675 23.8337 21.7679 23.5011 22.1011C23.1679 22.4337 22.7675 22.6 22.3 22.6H8.7Z"]');

      if (btn) {
        clearInterval(waitForButton);
        console.log("[AUTOCLICK] Botão disponível, clicando...");
        btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      }
    }, 300);
  </script>
</body>
</html>
