<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLibras - Solução Definitiva</title>
  <style>
    /* Estilo base seguro para o widget */
    [vw].enabled {
      position: fixed !important;
      z-index: 2147483647 !important;
      display: block !important;
    }
    
    /* Centralização controlada por classe */
    [vw].centered {
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      margin: 0 !important;
    }
    
    /* Esconder botão de forma definitiva */
    [vw-access-button].permanently-hidden {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    
    /* Garantir que o wrapper fique visível */
    [vw-plugin-wrapper].active {
      display: flex !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
  </style>
</head>
<body>
  <h1>Conteúdo da Página</h1>
  <p>Esta é uma demonstração com o widget VLibras sempre visível.</p>
  <p>Slap no flap na tcheca. Splash, afogando meu pau na xereca. Rocket poc, ploc, ploc, ploc. Pula ni mim, perereca</p>

  <!-- Container do VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="permanently-hidden"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <!-- Script VLibras -->
  <script src="./script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Inicialização com callback
      const widget = new window.VLibras.Widget({
        rootPath: 'https://vlibras.gov.br/app',
        position: 'T',
        opacity: 0.95
      });
      
      // 2. Controle de estado do widget
      let widgetInitialized = false;
      const maxAttempts = 15;
      let attempts = 0;
      
      // 3. Função de verificação robusta
      function ensureWidgetVisible() {
        attempts++;
        
        const mainWidget = document.querySelector('[vw].enabled');
        const pluginWrapper = document.querySelector('[vw-plugin-wrapper]');
        const accessButton = document.querySelector('[vw-access-button]');
        
        // Condições de sucesso
        if (mainWidget && pluginWrapper && accessButton) {
          // Aplica estilos definitivos
          mainWidget.classList.add('centered');
          accessButton.classList.add('permanently-hidden');
          
          // Força a abertura se necessário
          if (!pluginWrapper.classList.contains('active')) {
            accessButton.click();
          }
          
          // Monitoramento contínuo
          if (!widgetInitialized) {
            widgetInitialized = true;
            console.log('Widget VLibras inicializado com sucesso');
            
            // Observer para mudanças no wrapper
            const observer = new MutationObserver(function(mutations) {
              mutations.forEach(function(mutation) {
                if (!pluginWrapper.classList.contains('active')) {
                  pluginWrapper.classList.add('active');
                }
                if (!mainWidget.classList.contains('centered')) {
                  mainWidget.classList.add('centered');
                }
              });
            });
            
            observer.observe(pluginWrapper, {
              attributes: true,
              attributeFilter: ['class']
            });
          }
        }
        else if (attempts >= maxAttempts) {
          console.warn('Widget não carregou completamente após tentativas');
          return;
        }
        else {
          // Continua tentando até o limite
          setTimeout(ensureWidgetVisible, 300);
        }
      }
      
      // 4. Inicia o processo
      setTimeout(ensureWidgetVisible, 1000);
      
      // 5. Fallback para redimensionamento
      window.addEventListener('resize', function() {
        const mainWidget = document.querySelector('[vw].enabled');
        if (mainWidget) {
          mainWidget.classList.add('centered');
        }
      });
    });
  </script>
</body>
</html>
