<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLibras - Solução Definitiva | Transmissão de Áudio</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="permanently-hidden"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <main class="container">
    <h1>Transmissão de Áudio</h1>
    <div class="controls">
      <button id="startBtn" class="btn">Conectar</button>
      <button id="stopBtn" class="btn" disabled>Desconectar</button>
      <div id="status" class="status connecting">Status: Desconectado</div>
    </div>
  </main>

  <script src="./js/script-vlibras.js"></script>
  <script>
    (function monitorarVLibras() {
      let pulouIntro = false;
    
      const interval = setInterval(() => {
        const btnPular = document.querySelector('.vpw-skip-welcome-message');
        if (btnPular && !pulouIntro) {
          btnPular.click();
          btnPular.style.display = 'none';
          pulouIntro = true;
        }

        if (pulouIntro) {
          const vpwBox = document.querySelector('[vp-box].vpw-box');
          if (vpwBox) {
            vpwBox.style.display = 'none';

            const estiloAtual = window.getComputedStyle(vpwBox).display;
            if (estiloAtual === 'none') {
              clearInterval(interval);
            }
          }
        }
      }, 10);
    })();

    const verificarEsconderVpwBox = setInterval(() => {
      const vpwBox = document.querySelector('[vp-box].vpw-box');
      if (vpwBox) {
        vpwBox.style.display = 'none';

        const estiloAtual = window.getComputedStyle(vpwBox).display;
        if (estiloAtual === 'none') {
          clearInterval(verificarEsconderVpwBox);
        }
      }
    }, 10);
  </script>
  <script src="./js/script.js"></script>
  <script src="./js/audio_ws.js"></script>
</body>
</html>
