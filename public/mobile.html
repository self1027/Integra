<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Solução de acessibilidade com VLibras para transmissão de áudio - Versão Mobile">
  <title>VLibras Mobile - Tradução em Tempo Real</title>
  <link rel="icon" href="https://www.ifmg.edu.br/conselheirolafaiete/noticias/anexos-noticias/libras-768x767.png" type="image/png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Estilos específicos para mobile */
    body {
      padding: 10px;
      font-size: 16px;
    }
    
    .container {
      width: 100%;
      padding: 15px;
      margin: 0 auto;
      max-width: 100%;
    }
    
    h1 {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    
    .controls {
      gap: 10px;
    }
    
    .btn {
      padding: 12px 15px;
      font-size: 1rem;
      width: 100%;
    }
    
    /* VLibras posicionamento para mobile */
    [vw].enabled {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 1000 !important;
      width: 90% !important;
      max-width: 300px !important;
    }
    
    /* Barra de navegação */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #2c3e50;
      color: white;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    
    .navbar-title {
      font-size: 1rem;
      font-weight: bold;
    }
    
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    
    .back-btn i {
      margin-right: 5px;
    }
    
    /* Status com cores */
    .status.connecting {
      background-color: #f39c12;
      color: white;
    }
    
    .status.connected {
      background-color: #2ecc71;
      color: white;
    }
    
    .status.error {
      background-color: #e74c3c;
      color: white;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="permanently-hidden"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <div class="navbar">
    <button class="back-btn" onclick="window.location.href='/'"><i class="fas fa-arrow-left"></i> Voltar</button>
    <div class="navbar-title">VLibras Mobile</div>
    <div style="width: 24px;"></div> <!-- Espaçador para centralizar o título -->
  </div>

  <main class="container">
    <h1>Tradução em Tempo Real - Mobile</h1>
    <div class="controls">
      <button id="startBtn" class="btn"><i class="fas fa-microphone"></i> Iniciar Tradução</button>
      <button id="stopBtn" class="btn" disabled><i class="fas fa-stop"></i> Parar Tradução</button>
      <div id="status" class="status connecting">Status: Desconectado</div>
    </div>
  </main>

  <script src="./js/script-vlibras.js"></script>
  <script>
    (function monitorarVLibras() {
      let pulouIntro = false;
    
      const interval = setInterval(() => {
        const btnPular = document.querySelector('.vpw-skip-welcome-message');
        if (btnPular && !pulouIntro) {
          btnPular.click();
          btnPular.style.display = 'none';
          pulouIntro = true;
        }

        if (pulouIntro) {
          const vpwBox = document.querySelector('[vp-box].vpw-box');
          if (vpwBox) {
            vpwBox.style.display = 'none';

            const estiloAtual = window.getComputedStyle(vpwBox).display;
            if (estiloAtual === 'none') {
              clearInterval(interval);
            }
          }
        }
      }, 10);
    })();

    const verificarEsconderVpwBox = setInterval(() => {
      const vpwBox = document.querySelector('[vp-box].vpw-box');
      if (vpwBox) {
        vpwBox.style.display = 'none';

        const estiloAtual = window.getComputedStyle(vpwBox).display;
        if (estiloAtual === 'none') {
          clearInterval(verificarEsconderVpwBox);
        }
      }
    }, 10);
  </script>
  <script src="./js/script.js"></script>
  <script src="./js/audio_ws.js"></script>
</body>
</html>
